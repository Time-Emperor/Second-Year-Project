<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AHHCS - Register</title>
    <style>
        body { font-family: monospace; background: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { border: 1px solid #000000; padding: 2rem; width: 300px; background: #ffffff; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem 0; border: 1px solid #000000; background: #ffffff; color: #000000; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #000000; color: #ffffff; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #333333; }
        a { color: #000000; display: block; margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .flash { color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register Account</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" required>
            <button type="submit">Create Account</button>
        </form>
        <a href="{{ url_for('login') }}">Already have an account? Login</a>
    </div>
</body>
</html>
