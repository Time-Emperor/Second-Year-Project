<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AHHCS - Login</title>
    <style>
        body { font-family: monospace; background: #ffffff; color: #000000; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { border: 1px solid #000000; padding: 2rem; width: 340px; background: #ffffff; }
        input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem 0; border: 1px solid #000000; background: #ffffff; color: #000000; box-sizing: border-box; font-family: monospace; }
        button { width: 100%; padding: 0.75rem; background: #000000; color: #ffffff; border: none; font-weight: bold; cursor: pointer; font-family: monospace; }
        button:hover { background: #333333; }
        a { color: #000000; display: block; margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .hint { font-size: 0.75rem; color: #333333; margin-top: -0.6rem; margin-bottom: 1rem; line-height: 1.3; }
        .flash { color: #dc2626; font-size: 0.85rem; margin-bottom: 1rem; }
        .flash-success { color: #16a34a; }
    </style>
</head>
<body>
    <div class="card">
        <h2>System Login</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" required>
            <label>Password</label>
            <input type="password" name="password" minlength="8" required>
            <div class="hint">Requires 8+ chars, uppercase letter, number, and special character.</div>
            <button type="submit">Authenticate</button>
        </form>
        <a href="{{ url_for('register') }}">Register new account</a>
    </div>
</body>
</html>
